name: Build Unsigned IPA for E-Sign

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          lfs: true

      - name: Force update submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Select Xcode and list schemes
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project Moonlight.xcodeproj

      - name: Build Moonlight unsigned
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_ALLOWS_MIXED_DIST_CERTS=YES \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package IPA
        run: |
          echo "Searching for .app..."
          find ./DerivedData -name "*.app" -type d
          
          APP_PATH=$(find ./DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "Moonlight.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData/Build/Products -name "Moonlight.app" -type d | head -n 1)
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app found!"
            exit 1
          fi
          
          echo "Found app: $APP_PATH"
          ls -lh "$APP_PATH"
          
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          rm -rf Payload/*.app/_CodeSignature || true
          rm -rf Payload/*.app/embedded.mobileprovision || true
          
          zip -r -y Moonlight-unsigned.ipa Payload
          ls -lh *.ipa
          shasum -a 256 Moonlight-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-IPA
          path: Moonlight-unsigned.ipa
          retention-days: 14
          if-no-files-found: error
