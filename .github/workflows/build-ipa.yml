name: Build patched IPA
on: push
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          xcodebuild -workspace Moonlight.xcworkspace -scheme Moonlight -configuration Release -archivePath build/Moonlight.xcarchive archive CODE_SIGNING_ALLOWED=NO || true
          mkdir -p build
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-patched
          path: build/
