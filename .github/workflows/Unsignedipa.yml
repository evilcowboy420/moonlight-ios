name: Build Unsigned IPA for E-Sign

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcodebuild -list -project Moonlight.xcodeproj

      - name: Build Unsigned .app
        run: |
          xcodebuild \
            -project Moonlight.xcodeproj \
            -scheme Moonlight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath ./DerivedData \
            build

      - name: Package IPA for E-Sign
        run: |
          APP_PATH=$(find ./DerivedData/Build/Products -name "Moonlight.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find ./DerivedData/Build/Products -name "*.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          
          # Make truly unsigned for E-Sign / AltStore / SideStore
          rm -rf Payload/*.app/_CodeSignature || true
          rm -rf Payload/*.app/embedded.mobileprovision || true
          
          zip -r -y Moonlight-unsigned.ipa Payload
          ls -lh *.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-unsigned-IPA
          path: Moonlight-unsigned.ipa
          retention-days: 7
